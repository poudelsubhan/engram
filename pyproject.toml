[project]
name = "engram"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.11",
    "langgraph-checkpoint-mongodb>=0.4.0",
    "openai>=3.0.0",
    "pymongo>=4.16.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
engram = "engram.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["atlas: requires a live Atlas cluster (MONGODB_URI)"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
